name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # pytest is a dev tool, not a dependency: the zero-dependency promise
          # is about what `pip install tlslint` drags in.
          python -m pip install pytest
          python -c "import tlslint, sys; print('imported with deps:', [m for m in sys.modules if m in ('yaml','click','rich','requests','cryptography')])"
          python -c "
          import subprocess, sys
          mods = subprocess.run([sys.executable, '-c', 'import tlslint.cli'], capture_output=True)
          assert mods.returncode == 0, mods.stderr.decode()
          print('cli imports cleanly with no third-party packages installed')
          "

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          tlslint --version
          tlslint rules | head -5
          tlslint cert tests/fixtures/expired.pem
          tlslint cert src/tlslint/data/demo/good.pem --hostname elsewhere.test
          tlslint demo --json > /tmp/demo.json
          python -c "import json; d=json.load(open('/tmp/demo.json')); print('demo findings:', len(d['findings']), 'grade', d['grade'])"

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          from tlslint.mcp_server import build_server
          import asyncio, inspect
          s = build_server()
          async def go():
              tools = await s.list_tools()
              return sorted(t.name for t in tools)
          names = asyncio.run(go())
          expected = sorted(['tlslint_scan','tlslint_cert','tlslint_rules','tlslint_explain','tlslint_grade','tlslint_demo','tlslint_sarif'])
          assert names == expected, names
          print('mcp tools:', names)
          "

  fresh-clone:
    # Every other job installs the package before testing, which is exactly why
    # a broken `pytest` on a bare clone goes unnoticed: the src/ layout needs
    # the root conftest.py to put src/ on sys.path. Install pytest and nothing
    # else, then let the suite bootstrap itself.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: pytest only, no package install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: A bare clone can run its own tests
        run: python -m pytest -q

      - name: And the CLI still works from src
        run: python -c "import sys; sys.path.insert(0, 'src'); import tlslint.cli; print('cli ok')"

  slow-tests:
    # Each lab test starts a local TLS server or waits on a closed port, so the
    # whole group costs about 144s of the 156s suite. They are marked `slow` and
    # skipped by default to keep `pytest` at roughly 15s for development, but
    # they still collect (the badge count is unchanged) and this job is what
    # proves they pass. The matrix above runs the default selection.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" pytest
      - name: Full suite including the lab servers
        run: python -m pytest -q --runslow

  demo-contract:
    # The demo is the first thing a visitor runs, and it has to work with no
    # network. The certificate rules are asserted absolutely (the fixtures are
    # checked in and the clock is fixed); the protocol and cipher rules are
    # asserted as consistency inside the suite, because which of them can be
    # negotiated depends on the OpenSSL build of the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: The demo fires the certificate rules
        run: |
          tlslint demo > /tmp/report.txt
          missing=""
          for id in TLS020 TLS021 TLS022 TLS023 TLS024 TLS025 TLS026 TLS027 TLS028 TLS029 TLS032 TLS033 TLS034 TLS035 TLS036 TLS037 TLS038 TLS039 TLS040; do
            grep -q "$id" /tmp/report.txt || missing="$missing $id"
          done
          if [ -n "$missing" ]; then
            echo "::error::these rules are missing from the demo report:$missing"
            exit 1
          fi
          echo "every certificate rule is present in the demo report"
      - name: The demo needs no network
        run: |
          # A job with no external network is the only honest proof; the
          # assertions above already ran entirely on localhost.
          grep -q "no connection left the machine" /tmp/report.txt

  badge-check:
    # The README test count is the first number a visitor reads. It is checked
    # here, where the optional deps are installed and every module collects,
    # rather than inside the matrix: self-skipping modules make the count
    # environment-dependent and produce a week of false alarms.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install with optional test deps
        run: |
          python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest collection
        run: |
          actual=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} claimed=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::error::README badge says $claimed but pytest collects $actual"
            exit 1
          fi
